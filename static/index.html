<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NutriTool — Personal Nutrient Tracker</title>
<script src="vendor/react.production.min.js"></script>
<script src="vendor/react-dom.production.min.js"></script>
<script src="vendor/babel.min.js"></script>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e0e2e7;
    --text: #1c1e21;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --ok: #16a34a;
    --warn: #d97706;
    --bad: #dc2626;
    --track: #e5e7eb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
  }
  #root { max-width: 1100px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 4px 0; }
  h2 { font-size: 15px; margin: 0 0 10px 0; }
  .subtitle { color: var(--text-dim); font-size: 12px; margin-bottom: 16px; }
  .subtitle a { color: var(--accent); }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
  .tab {
    padding: 8px 14px; cursor: pointer; border: none; background: none;
    font-size: 13px; color: var(--text-dim); border-bottom: 2px solid transparent;
  }
  .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 16px; margin-bottom: 16px;
  }
  .group-title {
    font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--text-dim); margin: 18px 0 8px 0; font-weight: 600;
  }
  .group-title:first-child { margin-top: 0; }
  .nutrient-row {
    display: grid; grid-template-columns: 150px 1fr 130px 60px; gap: 10px;
    align-items: center; padding: 5px 0; font-size: 12.5px;
  }
  .nutrient-name { display: flex; align-items: center; gap: 4px; }
  .bar-track {
    background: var(--track); border-radius: 4px; height: 10px; overflow: hidden; position: relative;
  }
  .bar-fill { height: 100%; border-radius: 4px; transition: width 0.2s; }
  .bar-fill.ok { background: var(--ok); }
  .bar-fill.warn { background: var(--warn); }
  .bar-fill.bad { background: var(--bad); }
  .nutrient-values { text-align: right; color: var(--text-dim); white-space: nowrap; }
  .flag-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 600; text-align: center;
  }
  .flag-badge.low { background: #fee2e2; color: var(--bad); }
  .flag-badge.ok { background: transparent; color: var(--text-dim); }
  .info-icon {
    display: inline-flex; align-items: center; justify-content: center;
    width: 14px; height: 14px; border-radius: 50%; background: var(--track);
    color: var(--text-dim); font-size: 9px; font-weight: 700; cursor: help; flex-shrink: 0;
  }
  .badge-tag {
    font-size: 9px; padding: 0 4px; border-radius: 3px; background: var(--track); color: var(--text-dim);
    margin-left: 4px; font-weight: 500;
  }
  label { display: block; font-size: 12px; color: var(--text-dim); margin-bottom: 3px; margin-top: 10px; }
  input, select, button {
    font-family: inherit; font-size: 13px; padding: 6px 8px; border: 1px solid var(--border);
    border-radius: 5px; background: #fff; color: var(--text);
  }
  input:focus, select:focus { outline: 1px solid var(--accent); }
  button {
    cursor: pointer; background: var(--accent); color: #fff; border: none; font-weight: 600;
  }
  button:hover { opacity: 0.9; }
  button.secondary { background: var(--track); color: var(--text); }
  button.danger { background: var(--bad); color: #fff; }
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px 16px; }
  .food-list { max-height: 220px; overflow-y: auto; border: 1px solid var(--border); border-radius: 5px; margin-top: 6px; }
  .food-item { padding: 6px 10px; cursor: pointer; border-bottom: 1px solid var(--border); font-size: 12.5px; display: flex; justify-content: space-between; }
  .food-item:last-child { border-bottom: none; }
  .food-item:hover { background: #f0f4ff; }
  .food-item.selected { background: #e0eaff; }
  .food-item .src { color: var(--text-dim); font-size: 10px; }
  .log-row {
    display: grid; grid-template-columns: 1fr 90px 150px 70px 70px; gap: 8px;
    align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12.5px;
  }
  .log-row:last-child { border-bottom: none; }
  .muted { color: var(--text-dim); font-size: 11px; }
  .quick-amounts { display: flex; gap: 4px; margin-top: 4px; }
  .quick-amounts button { padding: 3px 8px; font-size: 11px; }
  .callout {
    background: #fffbeb; border: 1px solid #fde68a; border-radius: 6px; padding: 10px 12px;
    font-size: 12px; color: #78350f; margin-bottom: 14px;
  }
  .footer-note { font-size: 11px; color: var(--text-dim); margin-top: 24px; line-height: 1.6; }
  .empty-state { color: var(--text-dim); font-size: 12.5px; padding: 20px; text-align: center; }
  .error-state {
    background: #fef2f2; border: 1px solid #fecaca; border-radius: 6px; padding: 14px;
    color: #7f1d1d; font-size: 12.5px; line-height: 1.6;
  }
  details summary { cursor: pointer; font-size: 12px; color: var(--accent); margin: 4px 0; }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback, useRef } = React;

/* ============================================================================
 * PERSONALIZATION CONFIG
 * ----------------------------------------------------------------------------
 * Edit these defaults before first run, or use the in-app Settings tab
 * (which reads/writes this same shape via the hosted /api/data endpoint —
 * whichever you edit last "wins" once you've opened the app once and saved
 * via the UI).
 *
 *   age            years
 *   sex            'male' | 'female'  (used because several RDAs, e.g. iron,
 *                  differ by sex — iron RDA is higher for menstruating women)
 *   weightKg       body weight in kilograms
 *   heightCm       height in centimeters
 *   activityLevel  'sedentary' | 'light' | 'moderate' | 'active'
 *                  sedentary = little/no exercise
 *                  light     = light exercise 1-3 days/week
 *                  moderate  = moderate exercise 3-5 days/week
 *                  active    = hard exercise 6-7 days/week
 * ========================================================================= */
const DEFAULT_CONFIG = {
  age: 35,
  sex: 'male',
  weightKg: 75,
  heightCm: 178,
  activityLevel: 'moderate',
};

/* ============================================================================
 * NUTRIENT PANEL (29 nutrients)
 * ----------------------------------------------------------------------------
 * Note: the original spec summarized this panel as "28 total" (7 macros +
 * 10 minerals + 11 vitamins) but the explicit vitamin enumeration lists 12
 * items (A, C, D, E, K, B1, B2, B3, B6, B12, Folate, Choline). We track all
 * 12 explicitly-named vitamins, making 29 nutrients total. Following the
 * enumerated list rather than the summary count.
 *
 * decay: 'daily'    -> resets at local midnight, compared to daily RDA,
 *                       flagged below 70% of target
 *        'calcium'  -> special-cased, see CALCIUM_NOTE below
 *        'lookback' -> rolling exponential-decay window, flagged below 60%
 * ========================================================================= */
const NUTRIENTS = [
  // Macronutrients
  { key: 'kcal',      label: 'Calories',       unit: 'kcal',    group: 'macro', decay: 'daily' },
  { key: 'protein',   label: 'Protein',        unit: 'g',       group: 'macro', decay: 'daily' },
  { key: 'fat',       label: 'Total Fat',      unit: 'g',       group: 'macro', decay: 'daily' },
  { key: 'satfat',    label: 'Saturated Fat',  unit: 'g',       group: 'macro', decay: 'daily' },
  { key: 'carbs',     label: 'Carbohydrates',  unit: 'g',       group: 'macro', decay: 'daily' },
  { key: 'fiber',     label: 'Fiber',          unit: 'g',       group: 'macro', decay: 'daily' },
  { key: 'sugar',     label: 'Sugar',          unit: 'g',       group: 'macro', decay: 'daily' },
  // Minerals
  { key: 'sodium',     label: 'Sodium',      unit: 'mg',  group: 'mineral', decay: 'daily' },
  { key: 'potassium',  label: 'Potassium',   unit: 'mg',  group: 'mineral', decay: 'daily' },
  { key: 'calcium',    label: 'Calcium',     unit: 'mg',  group: 'mineral', decay: 'calcium' },
  { key: 'iron',       label: 'Iron',        unit: 'mg',  group: 'mineral', decay: 'lookback' },
  { key: 'magnesium',  label: 'Magnesium',   unit: 'mg',  group: 'mineral', decay: 'lookback' },
  { key: 'zinc',       label: 'Zinc',        unit: 'mg',  group: 'mineral', decay: 'lookback' },
  { key: 'phosphorus', label: 'Phosphorus',  unit: 'mg',  group: 'mineral', decay: 'lookback' },
  { key: 'copper',     label: 'Copper',      unit: 'mg',  group: 'mineral', decay: 'lookback' },
  { key: 'manganese',  label: 'Manganese',   unit: 'mg',  group: 'mineral', decay: 'lookback' },
  { key: 'selenium',   label: 'Selenium',    unit: 'mcg', group: 'mineral', decay: 'lookback' },
  // Vitamins
  { key: 'vitA',    label: 'Vitamin A',        unit: 'mcg RAE', group: 'vitamin', decay: 'lookback' },
  { key: 'vitC',    label: 'Vitamin C',        unit: 'mg',      group: 'vitamin', decay: 'daily' },
  { key: 'vitD',    label: 'Vitamin D',        unit: 'mcg',     group: 'vitamin', decay: 'lookback' },
  { key: 'vitE',    label: 'Vitamin E',        unit: 'mg',      group: 'vitamin', decay: 'lookback' },
  { key: 'vitK',    label: 'Vitamin K',        unit: 'mcg',     group: 'vitamin', decay: 'lookback' },
  { key: 'b1',      label: 'Thiamin (B1)',     unit: 'mg',      group: 'vitamin', decay: 'daily' },
  { key: 'b2',      label: 'Riboflavin (B2)',  unit: 'mg',      group: 'vitamin', decay: 'daily' },
  { key: 'b3',      label: 'Niacin (B3)',      unit: 'mg',      group: 'vitamin', decay: 'daily' },
  { key: 'b6',      label: 'Vitamin B6',       unit: 'mg',      group: 'vitamin', decay: 'daily' },
  { key: 'b12',     label: 'Vitamin B12',      unit: 'mcg',     group: 'vitamin', decay: 'daily' },
  { key: 'folate',  label: 'Folate',           unit: 'mcg',     group: 'vitamin', decay: 'daily' },
  { key: 'choline', label: 'Choline',          unit: 'mg',      group: 'vitamin', decay: 'lookback' },
];
const NUTRIENT_KEYS = NUTRIENTS.map(n => n.key);
const NUTRIENT_BY_KEY = Object.fromEntries(NUTRIENTS.map(n => [n.key, n]));
const GROUP_LABELS = { macro: 'Macronutrients', mineral: 'Minerals', vitamin: 'Vitamins' };
const GROUP_ORDER = ['macro', 'mineral', 'vitamin'];

const CALCIUM_NOTE =
  "Calcium is NOT modeled with decay or a rolling window like the other minerals. " +
  "It's tightly hormonally regulated (parathyroid hormone, calcitonin, vitamin D) and " +
  "buffered by bone stores, so short-term low intake doesn't produce a 'depleting level' " +
  "the way it does for iron or vitamin D. Real calcium deficiency effects (bone density " +
  "loss) develop over years, not days or weeks — this tool does not attempt to model or " +
  "flag long-term calcium status. It's shown here against the daily RDA purely as an " +
  "intake-tracking convenience, flagged below 70% like the daily-reset nutrients, but this " +
  "does NOT reflect your actual body calcium status.";

const FINISHED_WEIGHT_NOTE =
  "\"Per 100g\" is a concentration, not just a sum of what went in — it depends on how much the " +
  "finished dish actually weighs. Leaving finished weight blank falls back to the raw sum of " +
  "ingredient grams, which is a real approximation: cooking changes total weight in both directions " +
  "(evaporation shrinks it, e.g. reducing a sauce or roasting meat; water absorption grows it, e.g. " +
  "rice, pasta, dried beans). Using the wrong denominator skews EVERY nutrient's per-100g value by " +
  "the same ratio, not just water-related ones — so weighing the finished dish, even roughly, " +
  "meaningfully improves accuracy. NOT modeled here: nutrient loss/leaching from heat or drain-off " +
  "(that would need USDA retention-factor tables per cooking method) — this only corrects for " +
  "mass/dilution, a separate concern from nutrient degradation.";

/* ============================================================================
 * DECAY / LOOKBACK-WINDOW TABLE (class 3 nutrients)
 * ----------------------------------------------------------------------------
 * target = RDA x lookback window (days)
 * running level = sum of intake within the window, weighted by
 *   amount * 0.5 ^ (elapsedDays / halfLife)     (smooth exponential fade,
 *   not a hard cliff at the window edge)
 *
 * Default half-life = window / 2, EXCEPT choline (explicit 7-day half-life,
 * NOT derived from its 30-day window — choline turns over faster than the
 * mineral-default group despite sharing their window length).
 *
 * basis: 'sourced'            = grounded in cited pharmacokinetic data
 *        'sourced-ambiguous'  = sourced but the source itself is ambiguous/contested
 *        'unsourced-default'  = no turnover data found; shared estimate placeholder
 *        'estimated-override' = explicit estimate overriding the window/2 default
 * ========================================================================= */
const LOOKBACK_TABLE = {
  vitD:       { window: 60,  halfLife: 30,  basis: 'sourced',
                note: '25(OH)D plasma half-life ~15-21 days' },
  vitA:       { window: 180, halfLife: 90,  basis: 'sourced',
                note: 'Liver reserve up to ~1yr; conservative half of window used' },
  vitK:       { window: 5,   halfLife: 2.5, basis: 'sourced',
                note: 'Minimal storage, ~1.5-day body pool turnover' },
  vitE:       { window: 21,  halfLife: 10.5, basis: 'sourced-ambiguous',
                note: 'Plasma half-life ~3 days vs. longer adipose storage' },
  iron:       { window: 90,  halfLife: 45,  basis: 'sourced',
                note: 'Store depletion/repletion is a documented 3-6 month process' },
  zinc:       { window: 21,  halfLife: 10.5, basis: 'sourced-ambiguous',
                note: 'Plasma pool turns over in ~2 days, but most body zinc is in slower muscle/bone' },
  magnesium:  { window: 30,  halfLife: 15,  basis: 'unsourced-default',
                note: 'Shared default for minerals lacking turnover data' },
  phosphorus: { window: 30,  halfLife: 15,  basis: 'unsourced-default',
                note: 'Shared default for minerals lacking turnover data' },
  copper:     { window: 30,  halfLife: 15,  basis: 'unsourced-default',
                note: 'Shared default for minerals lacking turnover data' },
  manganese:  { window: 30,  halfLife: 15,  basis: 'unsourced-default',
                note: 'Shared default for minerals lacking turnover data' },
  selenium:   { window: 30,  halfLife: 15,  basis: 'unsourced-default',
                note: 'Shared default for minerals lacking turnover data' },
  choline:    { window: 30,  halfLife: 7,   basis: 'estimated-override',
                note: 'Explicit override — faster turnover than the mineral-default group despite the same window' },
};
const BASIS_LABEL = {
  'sourced': 'sourced',
  'sourced-ambiguous': 'sourced, ambiguous',
  'unsourced-default': 'estimate',
  'estimated-override': 'estimate',
};

const DAILY_FLAG_THRESHOLD = 0.70;
const LOOKBACK_FLAG_THRESHOLD = 0.60;

/* ============================================================================
 * RDA / AI TARGET CALCULATION
 * ----------------------------------------------------------------------------
 * Sources: NIH Office of Dietary Supplements (ods.od.nih.gov) fact sheets and
 * nutrient recommendation tables, which summarize the National Academies'
 * Dietary Reference Intake (DRI) reports. Calorie/macro formulas as noted
 * inline. All values are adult (19+) DRIs; age is clamped to 19 for bracket
 * lookups (this tool is not intended for pediatric use).
 * ========================================================================= */
function ageBracket(age) {
  const a = Math.max(19, age);
  if (a <= 30) return '19-30';
  if (a <= 50) return '31-50';
  if (a <= 70) return '51-70';
  return '70+';
}

function computeTargets(cfg) {
  const age = Math.max(19, Number(cfg.age) || 19);
  const sex = cfg.sex === 'female' ? 'female' : 'male';
  const weight = Number(cfg.weightKg) || 70;
  const height = Number(cfg.heightCm) || 170;
  const bracket = ageBracket(age);
  const isMale = sex === 'male';

  // Mifflin-St Jeor equation (BMR), then scaled by activity factor -> TDEE.
  const bmr = isMale
    ? 10 * weight + 6.25 * height - 5 * age + 5
    : 10 * weight + 6.25 * height - 5 * age - 161;
  const ACTIVITY_MULT = { sedentary: 1.2, light: 1.375, moderate: 1.55, active: 1.725 };
  const calories = bmr * (ACTIVITY_MULT[cfg.activityLevel] || ACTIVITY_MULT.sedentary);

  // Macronutrient targets derived from calories (AMDR midpoints / DGA limits).
  const protein = 0.8 * weight; // NIH ODS: 0.8 g/kg/day adult RDA
  const fat = (0.30 * calories) / 9; // AMDR 20-35%, midpoint 30%
  const satfat = (0.10 * calories) / 9; // DGA: <10% of calories (an upper limit, not a depletion target)
  const carbs = (0.50 * calories) / 4; // AMDR 45-65%, midpoint 50%
  const sugar = (0.10 * calories) / 4; // DGA/AHA: added sugar <10% of calories (an upper limit)
  const fiber = age <= 50 ? (isMale ? 38 : 25) : (isMale ? 30 : 21); // IOM AI, g/day

  // Sodium: AI (not a "reach this" target — sodium AI is a minimum adequacy
  // value, most diets exceed it easily; the daily-reset "flag if <70%" logic
  // is applied uniformly per spec but is not a meaningful deficiency signal
  // for sodium in practice).
  const sodium = bracket === '19-30' || bracket === '31-50' ? 1500 : bracket === '51-70' ? 1300 : 1200;
  const potassium = isMale ? 3400 : 2600; // NASEM 2019 AI

  // Calcium RDA (mg/day)
  let calcium;
  if (bracket === '19-30' || bracket === '31-50') calcium = 1000;
  else if (bracket === '51-70') calcium = isMale ? 1000 : 1200;
  else calcium = 1200;

  // Iron RDA (mg/day) - differs by sex due to menstrual losses until ~51-70 bracket
  const iron = isMale ? 8 : (bracket === '19-30' || bracket === '31-50' ? 18 : 8);

  // Magnesium RDA (mg/day)
  const magnesium = isMale
    ? (bracket === '19-30' ? 400 : 420)
    : (bracket === '19-30' ? 310 : 320);

  const zinc = isMale ? 11 : 8; // RDA mg/day
  const phosphorus = 700; // RDA mg/day, flat adult
  const copper = 0.9; // RDA mg/day, flat adult
  const manganese = isMale ? 2.3 : 1.8; // AI mg/day
  const selenium = 55; // RDA mcg/day, flat adult

  const vitA = isMale ? 900 : 700; // RDA mcg RAE/day
  const vitC = isMale ? 90 : 75; // RDA mg/day
  const vitD = (bracket === '70+') ? 20 : 15; // RDA mcg/day (600 vs 800 IU)
  const vitE = 15; // RDA mg/day, flat adult
  const vitK = isMale ? 120 : 90; // AI mcg/day

  const b1 = isMale ? 1.2 : 1.1; // Thiamin RDA mg/day
  const b2 = isMale ? 1.3 : 1.1; // Riboflavin RDA mg/day
  const b3 = isMale ? 16 : 14; // Niacin RDA mg NE/day
  const b6 = (bracket === '19-30' || bracket === '31-50') ? 1.3 : (isMale ? 1.7 : 1.5); // RDA mg/day
  const b12 = 2.4; // RDA mcg/day, flat adult
  const folate = 400; // RDA mcg DFE/day, flat adult
  const choline = isMale ? 550 : 425; // AI mg/day

  const rdaDaily = {
    kcal: calories, protein, fat, satfat, carbs, fiber, sugar,
    sodium, potassium, calcium, iron, magnesium, zinc, phosphorus, copper, manganese, selenium,
    vitA, vitC, vitD, vitE, vitK, b1, b2, b3, b6, b12, folate, choline,
  };

  const targets = {};
  NUTRIENTS.forEach(n => {
    const rda = rdaDaily[n.key];
    if (n.decay === 'lookback') {
      targets[n.key] = { rda, target: rda * LOOKBACK_TABLE[n.key].window };
    } else {
      targets[n.key] = { rda, target: rda };
    }
  });
  return targets;
}

/* ============================================================================
 * SEED FOOD DATABASE (~100 foods, values per 100g)
 * ----------------------------------------------------------------------------
 * Approximate figures in the style of USDA FoodData Central (FDC), entered
 * from general nutrition-science knowledge rather than a live FDC API fetch.
 * Treat these as reasonable estimates for personal tracking, NOT lab-grade
 * precision — spot-check anything nutrient-critical against FDC directly
 * (fdc.nal.usda.gov). Unlisted/uncertain nutrients are left as `null`
 * ("no data") rather than defaulted to 0 ("no content").
 * ========================================================================= */
function mkFood(id, name, vals) {
  const nutrients = {};
  NUTRIENT_KEYS.forEach(k => { nutrients[k] = (vals[k] === undefined ? null : vals[k]); });
  return { id, name, source: 'seed', nutrients };
}

const SEED_FOODS = [
  mkFood('f1', 'Banana, raw', { kcal:89, protein:1.1, fat:0.3, satfat:0.1, carbs:22.8, fiber:2.6, sugar:12.2, sodium:1, potassium:358, calcium:5, iron:0.26, magnesium:27, zinc:0.15, vitC:8.7, b6:0.37, folate:20, vitK:0.5, manganese:0.27 }),
  mkFood('f2', 'Apple, raw, with skin', { kcal:52, protein:0.3, fat:0.2, satfat:0, carbs:13.8, fiber:2.4, sugar:10.4, sodium:1, potassium:107, calcium:6, iron:0.12, magnesium:5, vitC:4.6, vitK:2.2 }),
  mkFood('f3', 'Orange, raw', { kcal:47, protein:0.9, fat:0.1, satfat:0, carbs:11.8, fiber:2.4, sugar:9.4, sodium:0, potassium:181, calcium:40, iron:0.1, magnesium:10, vitC:53.2, folate:30, b1:0.09 }),
  mkFood('f4', 'Strawberries, raw', { kcal:32, protein:0.7, fat:0.3, satfat:0, carbs:7.7, fiber:2, sugar:4.9, sodium:1, potassium:153, calcium:16, iron:0.41, magnesium:13, vitC:58.8, folate:24, manganese:0.39 }),
  mkFood('f5', 'Blueberries, raw', { kcal:57, protein:0.7, fat:0.3, satfat:0, carbs:14.5, fiber:2.4, sugar:10, sodium:1, potassium:77, calcium:6, iron:0.28, magnesium:6, vitC:9.7, vitK:19.3, manganese:0.34 }),
  mkFood('f6', 'Grapes, raw', { kcal:69, protein:0.7, fat:0.2, satfat:0.1, carbs:18.1, fiber:0.9, sugar:15.5, sodium:2, potassium:191, calcium:10, iron:0.36, vitC:3.2, vitK:14.6 }),
  mkFood('f7', 'Avocado, raw', { kcal:160, protein:2, fat:14.7, satfat:2.1, carbs:8.5, fiber:6.7, sugar:0.7, sodium:7, potassium:485, calcium:12, iron:0.55, magnesium:29, zinc:0.64, vitC:10, vitE:2.07, vitK:21, folate:81, b6:0.26 }),
  mkFood('f8', 'Watermelon, raw', { kcal:30, protein:0.6, fat:0.2, satfat:0, carbs:7.6, fiber:0.4, sugar:6.2, sodium:1, potassium:112, calcium:7, vitC:8.1, vitA:28 }),
  mkFood('f9', 'Mango, raw', { kcal:60, protein:0.8, fat:0.4, satfat:0.1, carbs:15, fiber:1.6, sugar:13.7, sodium:1, potassium:168, calcium:11, vitC:36.4, vitA:54, folate:43 }),

 * Because the server is behind a login (see app.py), a 401/redirect here
 * usually means the session expired -- send the user back to /login rather
 * than showing a raw error.
 * ========================================================================= */
async function fetchData() {
  const res = await fetch('/api/data');
  if (res.status === 401 || res.redirected) {
    window.location.href = '/login';
    return new Promise(() => {}); // never resolves; navigation is underway
  }
  if (!res.ok) throw new Error('GET /api/data failed: ' + res.status);
  return res.json();
}

async function saveData(partial) {
  const res = await fetch('/api/data', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(partial),
  });
  if (res.status === 401 || res.redirected) {
    window.location.href = '/login';
    return new Promise(() => {});
  }
  if (!res.ok) throw new Error('POST /api/data failed: ' + res.status);
  return res.json();
}

/* ============================================================================
 * DECAY / LEVEL CALCULATIONS
 * ========================================================================= */
function sameLocalDay(ts, now) {
  const a = new Date(ts), b = new Date(now);
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}

function computeDailyLevel(entries, key, now) {
  let total = 0;
  for (const e of entries) {
    if (!sameLocalDay(e.timestamp, now)) continue;
    const amt = e.nutrients[key];
    if (amt != null) total += amt;
  }
  return total;
}

function computeLookbackLevel(entries, key, now) {
  const { halfLife } = LOOKBACK_TABLE[key];
  let total = 0;
  for (const e of entries) {
    const amt = e.nutrients[key];
    if (amt == null) continue;
    const elapsedDays = (now - e.timestamp) / 86400000;
    if (elapsedDays < 0) continue;
    total += amt * Math.pow(0.5, elapsedDays / halfLife);
  }
  return total;
}

function computeAllLevels(entries, now) {
  const levels = {};
  NUTRIENTS.forEach(n => {
    levels[n.key] = (n.decay === 'lookback')
      ? computeLookbackLevel(entries, n.key, now)
      : computeDailyLevel(entries, n.key, now);
  });
  return levels;
}

/* ============================================================================
 * ENTRY <-> NUTRIENT SNAPSHOT HELPERS
 * ========================================================================= */
function scaleNutrients(per100g, grams) {
  const out = {};
  NUTRIENT_KEYS.forEach(k => {
    const v = per100g[k];
    out[k] = (v == null) ? null : (v * grams) / 100;
  });
  return out;
}

function fmtNum(v, unit) {
  if (v == null) return '—';
  const decimals = (unit === 'mg' || unit === 'g') ? (v < 10 ? 2 : 1) : (v < 10 ? 1 : 0);
  return Number(v.toFixed(decimals)).toString();
}

/* ============================================================================
 * RECIPE / COOKED-FOOD COMPOSITE CALCULATION
 * ----------------------------------------------------------------------------
 * A "cooked food" (source: 'recipe') is a food built from other foods:
 *   { id, name, source: 'recipe', ingredients: [{ foodId, grams }, ...],
 *     finishedWeight: number | null, nutrients: <computed per-100g composite> }
 *
 * weightBasis = finishedWeight (if > 0), else the sum of ingredient grams.
 * Missing ingredient nutrient values are treated as 0 in this sum — the
 * null-means-unknown convention lives at the ingredient level, not the
 * composite, so a recipe is never partially null just because one
 * ingredient has a gap. Recomputed on every save (initial or edit), so an
 * edited recipe's nutrients never go stale relative to its current
 * ingredients/finishedWeight.
 *
 * NOT modeled: nutrient degradation/leaching from heat or drain-off (would
 * need USDA retention-factor tables per cooking method) — this only
 * corrects for mass/dilution (how much the dish weighs), a separate
 * concern from nutrient loss during cooking.
 * ========================================================================= */
function computeRecipeNutrients(ingredients, finishedWeight, allFoods) {
  const foodById = Object.fromEntries(allFoods.map(f => [f.id, f]));
  const ingredientWeightSum = ingredients.reduce((sum, ing) => sum + (Number(ing.grams) || 0), 0);
  const weightBasis = (Number(finishedWeight) > 0) ? Number(finishedWeight) : ingredientWeightSum;

  const composite = {};
  NUTRIENT_KEYS.forEach(key => {
    let sum = 0;
    ingredients.forEach(ing => {
      const food = foodById[ing.foodId];
      if (!food) return;
      const v = food.nutrients[key];
      sum += (v == null ? 0 : v) * (Number(ing.grams) || 0) / 100;
    });
    composite[key] = weightBasis > 0 ? (sum / weightBasis) * 100 : 0;
  });
  return composite;
}

/* ============================================================================
 * RECIPE DEPENDENCY GRAPH HELPERS
 * ----------------------------------------------------------------------------
 * Recipes can reference other recipes as ingredients (the ingredient picker
 * draws from allFoods, which includes recipe entries), so edits/deletes need
 * to consider that graph, not just the single food being touched.
 * ========================================================================= */

// Recipes (source: 'recipe') whose ingredients list includes foodId. Used to
// block deleting a food that's still relied on, and named in the UI message.
function foodUsedInRecipes(foodId, customFoods) {
  return customFoods.filter(f =>
    f.source === 'recipe' &&
    Array.isArray(f.ingredients) &&
    f.ingredients.some(ing => ing.foodId === foodId)
  );
}

// Re-run computeRecipeNutrients for every recipe in customFoods, rebuilding
// the allFoods snapshot each pass so a recipe that nests another recipe
// picks up its dependency's freshly-computed numbers. Repeated a fixed 4x
// so chains of nested recipes (A contains B contains C...) settle without
// needing real dependency-order sorting -- cheap and simple for the data
// sizes this tool deals with.
function recomputeDependents(customFoods) {
  let current = customFoods;
  for (let pass = 0; pass < 4; pass++) {
    const allFoodsSnapshot = [...SEED_FOODS, ...current];
    current = current.map(f => {
      if (f.source !== 'recipe') return f;
      return { ...f, nutrients: computeRecipeNutrients(f.ingredients, f.finishedWeight, allFoodsSnapshot) };
    });
  }
  return current;
}

// DFS from each proposed ingredient's foodId, through any nested recipe's
// own ingredients, checking whether it ever reaches back to targetId (the
// recipe being saved -- editingId, or null/undefined for a brand-new
// recipe). Run unconditionally for both create and edit: on create,
// targetId is null and can never match a real foodId, so this is a cheap
// no-op rather than a case worth special-casing out.
function wouldCreateCycle(startIngredients, targetId, allFoods) {
  if (!targetId) return false;
  const recipeById = {};
  allFoods.forEach(f => { if (f.source === 'recipe') recipeById[f.id] = f; });
  const visited = new Set();
  const stack = startIngredients.map(ing => ing.foodId);
  while (stack.length > 0) {
    const currentId = stack.pop();
    if (currentId === targetId) return true;
    if (visited.has(currentId)) continue;
    visited.add(currentId);
    const recipe = recipeById[currentId];
    if (recipe && Array.isArray(recipe.ingredients)) {
      recipe.ingredients.forEach(ing => stack.push(ing.foodId));
    }
  }
  return false;
}

/* ============================================================================
 * UI COMPONENTS
 * ========================================================================= */
function Tooltip({ text }) {
  return <span className="info-icon" title={text}>i</span>;
}

// Read-only nutrient breakdown for any food-like object ({ nutrients }).
// Shared by CookedFoodForm's live preview, FoodPicker's per-row expansion,
// and ManageFoodsPanel's "Details" view -- one place computing/rendering
// the same grouped list instead of three inline duplicates.
function FoodComposition({ food }) {
  return (
    <div>
      {GROUP_ORDER.map(group => (
        <div key={group}>
          <div className="group-title">{GROUP_LABELS[group]}</div>
          {NUTRIENTS.filter(n => n.group === group).map(n => (
            <div key={n.key} className="nutrient-row" style={{ gridTemplateColumns: '150px 1fr' }}>
              <div className="nutrient-name">{n.label}</div>
              <div className="nutrient-values">{fmtNum(food.nutrients[n.key], n.unit)} {n.unit}</div>
            </div>
          ))}
        </div>
      ))}
    </div>
  );
}

function NutrientRow({ nutrient, level, target, rda }) {
  const isLookback = nutrient.decay === 'lookback';
  const threshold = isLookback ? LOOKBACK_FLAG_THRESHOLD : DAILY_FLAG_THRESHOLD;
  const pct = target > 0 ? (level / target) * 100 : 0;
  const flagged = target > 0 && (level / target) < threshold;
  const barClass = pct >= threshold * 100 ? 'ok' : (pct >= threshold * 100 * 0.5 ? 'warn' : 'bad');
  const info = LOOKBACK_TABLE[nutrient.key];

  return (
    <div className="nutrient-row">
      <div className="nutrient-name">
        {nutrient.label}
        {nutrient.decay === 'calcium' && <Tooltip text={CALCIUM_NOTE} />}
        {isLookback && (
          <span className="badge-tag" title={info.note}>
            {info.window}d / {BASIS_LABEL[info.basis]}
          </span>
        )}
      </div>
      <div className="bar-track">
        <div className={"bar-fill " + barClass} style={{ width: Math.min(100, pct) + '%' }} />
      </div>
      <div className="nutrient-values">
        {fmtNum(level, nutrient.unit)} / {fmtNum(target, nutrient.unit)} {nutrient.unit}
        {' '}({pct.toFixed(0)}%)
      </div>
      <div>
        {flagged
          ? <span className="flag-badge low">LOW</span>
          : <span className="flag-badge ok"></span>}
      </div>
    </div>
  );
}

function Dashboard({ levels, targets }) {
  const now = Date.now();
  return (
    <div className="panel">
      <h2>Nutrient Dashboard</h2>
      <div className="muted" style={{ marginBottom: 10 }}>
        Macros / sodium / potassium / vitamin C / B-vitamins reset daily and are flagged below 70% of target.
        Calcium is intake-only (no decay model) — see the info icon. All other minerals and fat-soluble
        vitamins use a rolling exponential-decay window and are flagged below 60% of target.
      </div>
      {GROUP_ORDER.map(group => (
        <div key={group}>
          <div className="group-title">{GROUP_LABELS[group]}</div>
          {NUTRIENTS.filter(n => n.group === group).map(n => (
            <NutrientRow
              key={n.key}
              nutrient={n}
              level={levels[n.key]}
              target={targets[n.key].target}

      ))}
    </div>
  );
}

  const [query, setQuery] = useState('');
  const [expandedId, setExpandedId] = useState(null);
  const filtered = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return foods;
    return foods.filter(f => f.name.toLowerCase().includes(q));
  }, [foods, query]);

  return (
    <div>
      <label>Search food</label>
      <input
        type="text"
        placeholder="e.g. banana, chicken, almonds..."
        value={query}
        onChange={e => setQuery(e.target.value)}
        style={{ width: '100%' }}
      />
      <div className="food-list">
        {filtered.length === 0 && <div className="empty-state">No foods match "{query}"</div>}
        {filtered.map(f => (
          <div key={f.id}>
            <div
              className={"food-item" + (f.id === selectedId ? ' selected' : '')}

              <span>{f.name}</span>

                <button

// Shared by AddFoodForm (new custom food) and ManageFoodsPanel's inline edit

function NutrientFieldsGrid({ vals, onChange }) {

}

function AddFoodForm({ onAdd }) {

function CookedFoodForm({ allFoods, recipes, onSave, editRecipeRequest, onConsumeEditRecipeRequest }) {
  const [editingId, setEditingId] = useState(null);
  const [name, setName] = useState('');
  const [ingredients, setIngredients] = useState([]); // [{ foodId, grams }]
  const [finishedWeight, setFinishedWeight] = useState('');
  const [saveError, setSaveError] = useState(null);

  const addIngredient = (foodId) => setIngredients(prev => [...prev, { foodId, grams: 100 }]);
  const removeIngredient = (idx) => setIngredients(prev => prev.filter((_, i) => i !== idx));
  const setIngredientGrams = (idx, grams) =>
    setIngredients(prev => prev.map((ing, i) => (i === idx ? { ...ing, grams } : ing)));

  const ingredientWeightSum = ingredients.reduce((sum, ing) => sum + (Number(ing.grams) || 0), 0);
  const weightBasis = (Number(finishedWeight) > 0) ? Number(finishedWeight) : ingredientWeightSum;
  const preview = useMemo(
    () => computeRecipeNutrients(ingredients, finishedWeight, allFoods),
    [ingredients, finishedWeight, allFoods]
  );

  const loadRecipe = (recipe) => {
    setEditingId(recipe.id);
    setName(recipe.name);
    setIngredients(recipe.ingredients.map(i => ({ ...i })));
    setFinishedWeight(recipe.finishedWeight != null ? String(recipe.finishedWeight) : '');
    setSaveError(null);
  };

  // Requested from ManageFoodsPanel's "Edit" button on a recipe row: App
  // switches the tab and mode, then hands us the recipe id here. Consumed
  // once so switching away and back (or the parent re-rendering) doesn't
  // reload the form out from under an in-progress edit.
  useEffect(() => {
    if (!editRecipeRequest) return;
    const recipe = recipes.find(r => r.id === editRecipeRequest);
    if (recipe) loadRecipe(recipe);
    if (onConsumeEditRecipeRequest) onConsumeEditRecipeRequest();
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [editRecipeRequest]);

  const resetForm = () => {
    setEditingId(null);
    setName('');
    setIngredients([]);
    setFinishedWeight('');
    setSaveError(null);
  };

  const handleSave = () => {
    if (!name.trim() || ingredients.length === 0) return;
    if (wouldCreateCycle(ingredients, editingId, allFoods)) {
      setSaveError(
        "Can't save: one of these ingredients eventually leads back to this recipe itself " +
        "(a nested recipe loop). Remove the ingredient that chains back to it."
      );
      return;
    }
    setSaveError(null);
    const cleanIngredients = ingredients.map(ing => ({ foodId: ing.foodId, grams: Number(ing.grams) || 0 }));
    const fw = Number(finishedWeight) > 0 ? Number(finishedWeight) : null;
    onSave({
      id: editingId || ('r' + Date.now()),
      name: name.trim(),
      source: 'recipe',
      ingredients: cleanIngredients,
      finishedWeight: fw,
      nutrients: computeRecipeNutrients(cleanIngredients, fw, allFoods),
    });
    resetForm();
  };

  return (
    <div className="panel">
      <h2>{editingId ? 'Edit Cooked Food' : 'Add Cooked Food'}</h2>
      <div className="muted" style={{ marginBottom: 8 }}>
        Build a food from other foods (a recipe/dish). Pick ingredients below, enter grams used of each,
        name the result, and save — it then shows up in the food list like any other food.
      </div>
      <label>Name</label>
      <input type="text" value={name} onChange={e => setName(e.target.value)} style={{ width: '100%' }} />

      <div style={{ marginTop: 10 }}>
        <FoodPicker foods={allFoods} selectedId={null} onSelect={addIngredient} />
      </div>

      {ingredients.length > 0 && (
        <div style={{ marginTop: 10 }}>
          <label>Ingredients ({ingredientWeightSum}g total)</label>
          {ingredients.map((ing, idx) => {
            const food = allFoods.find(f => f.id === ing.foodId);
            return (
              <div className="log-row" key={idx} style={{ gridTemplateColumns: '1fr 90px 70px' }}>
                <div>{food ? food.name : '(unknown food)'}</div>
                <div>
                  <input
                    type="number"
                    min="0"
                    value={ing.grams}
                    onChange={e => setIngredientGrams(idx, Number(e.target.value))}
                    style={{ width: 70 }}
                  />
                </div>
                <div><button className="danger" onClick={() => removeIngredient(idx)}>Remove</button></div>
              </div>
            );
          })}
        </div>
      )}

      <label style={{ display: 'flex', alignItems: 'center', gap: 4 }}>
        Finished weight (g) — optional <Tooltip text={FINISHED_WEIGHT_NOTE} />
      </label>
      <input
        type="number"
        min="0"
        value={finishedWeight}
        onChange={e => setFinishedWeight(e.target.value)}
        style={{ width: 120 }}
      />
      <div className="muted" style={{ marginTop: 4 }}>
        {Number(finishedWeight) > 0
          ? `Using finished weight: ${finishedWeight}g as the per-100g basis.`
          : `No finished weight entered — falling back to the ${ingredientWeightSum}g ingredient sum as the basis (an approximation; see the info icon above).`}
      </div>

      {ingredients.length > 0 && (
        <div style={{ marginTop: 14, paddingTop: 12, borderTop: '1px solid var(--border)' }}>
          <div className="muted" style={{ marginBottom: 6 }}>
            Live preview — per 100g of finished dish (basis: {weightBasis.toFixed(0)}g)
          </div>
          <FoodComposition food={{ nutrients: preview }} />
        </div>
      )}

      {saveError && <div className="callout" style={{ marginTop: 12 }}>{saveError}</div>}

      <div style={{ marginTop: 12, display: 'flex', gap: 8 }}>
        <button onClick={handleSave} disabled={!name.trim() || ingredients.length === 0}>
          {editingId ? 'Save changes' : 'Save cooked food'}
        </button>
        {editingId && <button className="secondary" onClick={resetForm}>Cancel edit / start new</button>}
      </div>

      <div style={{ marginTop: 16 }}>
        <h2>Saved Cooked Foods</h2>
        {recipes.length === 0 && <div className="empty-state">No cooked foods saved yet.</div>}
        {recipes.length > 0 && (
          <div className="food-list">
            {recipes.map(r => (
              <div key={r.id} className="food-item" onClick={() => loadRecipe(r)}>
                <span>{r.name}</span>
                <span className="src">recipe</span>
              </div>
            ))}
          </div>
        )}
      </div>
    </div>
  );
}

    <div style={{ marginTop: 10, paddingTop: 10, borderTop: '1px solid var(--border)' }}>
      <label>Food name</label>
      <input type="text" value={name} onChange={e => setName(e.target.value)} style={{ width: '100%' }} />
      <NutrientFieldsGrid vals={vals} onChange={setVal} />
      <div style={{ marginTop: 12, display: 'flex', gap: 8 }}>
        <button onClick={handleSubmit}>Save changes</button>
        <button className="secondary" onClick={onCancel}>Cancel</button>
      </div>
    </div>
  );
}

function ManageFoodsPanel({ customFoods, onEditCustomFood, onDeleteFood, onRequestEditRecipe }) {
  const [expandedId, setExpandedId] = useState(null);
  const [editingCustomId, setEditingCustomId] = useState(null);
  const [blockedMessage, setBlockedMessage] = useState(null);

  const items = customFoods.filter(f => f.source === 'custom' || f.source === 'recipe');

  const handleDeleteClick = (food) => {
    const blockers = foodUsedInRecipes(food.id, customFoods);
    if (blockers.length > 0) {
      setBlockedMessage(
        `Can't delete "${food.name}" — it's used as an ingredient in ` +
        `${blockers.map(b => `"${b.name}"`).join(', ')}. Remove it from ` +
        `${blockers.length > 1 ? 'those recipes' : 'that recipe'} first.`
      );
      return;
    }
    setBlockedMessage(null);
    if (window.confirm(`Delete "${food.name}"? This can't be undone.`)) {
      onDeleteFood(food.id);
    }
  };

  return (
    <div className="panel">
      <h2>My Foods</h2>
      <div className="muted" style={{ marginBottom: 8 }}>
        Custom foods and cooked foods/recipes you've added. Seed foods aren't editable here —
        they're built into the app, not stored data.
      </div>
      {blockedMessage && <div className="callout">{blockedMessage}</div>}
      {items.length === 0 && <div className="empty-state">No custom foods or cooked foods yet.</div>}
      {items.map(food => (
        <div key={food.id} style={{ borderBottom: '1px solid var(--border)', padding: '8px 0' }}>
          <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', gap: 8 }}>
            <div>
              <strong>{food.name}</strong>{' '}
              <span className="src">{food.source === 'recipe' ? 'recipe' : 'custom'}</span>
            </div>
            <div style={{ display: 'flex', gap: 6, flexShrink: 0 }}>
              <button
                className="secondary"
                onClick={() => setExpandedId(prev => (prev === food.id ? null : food.id))}
              >
                {expandedId === food.id ? 'Hide' : 'Details'}
              </button>
              {food.source === 'custom' ? (
                <button
                  className="secondary"
                  onClick={() => setEditingCustomId(prev => (prev === food.id ? null : food.id))}
                >
                  {editingCustomId === food.id ? 'Cancel' : 'Edit'}
                </button>
              ) : (
                <button className="secondary" onClick={() => onRequestEditRecipe(food.id)}>Edit</button>
              )}
              <button className="danger" onClick={() => handleDeleteClick(food)}>Delete</button>
            </div>
          </div>
          {expandedId === food.id && <FoodComposition food={food} />}
          {editingCustomId === food.id && food.source === 'custom' && (
            <EditCustomFoodForm
              food={food}
              onSave={(id, name, vals) => { onEditCustomFood(id, name, vals); setEditingCustomId(null); }}
              onCancel={() => setEditingCustomId(null)}
            />
          )}
        </div>
      ))}
    </div>
  );
}

function SettingsPanel({ config, onSave }) {
  const [local, setLocal] = useState(config);
  useEffect(() => setLocal(config), [config]);

  const set = (k, v) => setLocal(prev => ({ ...prev, [k]: v }));

  return (
    <div className="panel">
      <h2>Personalization Settings</h2>
      <div className="muted" style={{ marginBottom: 8 }}>
        Used to compute your personalized RDA/AI targets (Mifflin-St Jeor for calories, NIH ODS / DRI
        tables for everything else). Changes apply immediately to the dashboard once saved.
      </div>
      <div className="form-grid">
        <div>
          <label>Age (years)</label>
          <input type="number" min="19" value={local.age} onChange={e => set('age', Number(e.target.value))} />
        </div>
        <div>
          <label>Sex</label>
          <select value={local.sex} onChange={e => set('sex', e.target.value)}>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>
        </div>
        <div>
          <label>Weight (kg)</label>
          <input type="number" min="1" value={local.weightKg} onChange={e => set('weightKg', Number(e.target.value))} />
        </div>
        <div>
          <label>Height (cm)</label>
          <input type="number" min="1" value={local.heightCm} onChange={e => set('heightCm', Number(e.target.value))} />
        </div>
        <div>
          <label>Activity level</label>
          <select value={local.activityLevel} onChange={e => set('activityLevel', e.target.value)}>
            <option value="sedentary">Sedentary (little/no exercise)</option>
            <option value="light">Light (1-3 days/week)</option>
            <option value="moderate">Moderate (3-5 days/week)</option>
            <option value="active">Active (6-7 days/week)</option>
          </select>
        </div>
      </div>
      <div style={{ marginTop: 12 }}>
        <button onClick={() => onSave(local)}>Save Settings</button>
      </div>
    </div>
  );
}

function App() {
  const [tab, setTab] = useState('dashboard');
  const [loaded, setLoaded] = useState(false);
  const [loadError, setLoadError] = useState(null);
  const [saveError, setSaveError] = useState(null);
  const [config, setConfig] = useState(DEFAULT_CONFIG);
  const [customFoods, setCustomFoods] = useState([]);
  const [log, setLog] = useState([]);
  const [editRecipeRequest, setEditRecipeRequest] = useState(null);
  const [, forceTick] = useState(0);
  const saveTimer = useRef(null);

  // Initial load from the hosted backend (GET /api/data).
  useEffect(() => {
    fetchData()
      .then(data => {
        setConfig({ ...DEFAULT_CONFIG, ...(data.config || {}) });
        setCustomFoods(data.customFoods || []);
        setLog(data.log || []);
        setLoaded(true);
      })
      .catch(err => setLoadError(String(err)));
  }, []);

  // Persist to the hosted backend (debounced POST /api/data) whenever
  // config/customFoods/log change, once the initial load has completed.
  useEffect(() => {
    if (!loaded) return;
    if (saveTimer.current) clearTimeout(saveTimer.current);
    saveTimer.current = setTimeout(() => {
      saveData({ config, customFoods, log })
        .then(() => setSaveError(null))
        .catch(err => setSaveError(String(err)));
    }, 400);
    return () => clearTimeout(saveTimer.current);
  }, [config, customFoods, log, loaded]);

  // Re-render periodically so decay bars visibly drift even with no new actions.
  useEffect(() => {
    const id = setInterval(() => forceTick(t => t + 1), 60000);
    return () => clearInterval(id);
  }, []);

  const allFoods = useMemo(() => [...SEED_FOODS, ...customFoods], [customFoods]);
  const targets = useMemo(() => computeTargets(config), [config]);
  const levels = useMemo(() => computeAllLevels(log, Date.now()), [log]);

  const handleLogFood = (food, grams) => {
    const entry = {
      id: 'e' + Date.now() + '_' + Math.random().toString(36).slice(2, 7),
      foodId: food.id,
      foodName: food.name,
      grams,
      timestamp: Date.now(),
      per100g: food.nutrients,
      nutrients: scaleNutrients(food.nutrients, grams),
    };
    setLog(prev => [...prev, entry]);
  };

  const handleDeleteEntry = (id) => setLog(prev => prev.filter(e => e.id !== id));

  const handleEditGrams = (id, grams) => {
    setLog(prev => prev.map(e => {
      if (e.id !== id) return e;
      const g = Math.max(0, grams || 0);
      return { ...e, grams: g, nutrients: scaleNutrients(e.per100g, g) };
    }));
  };

  const handleAddFood = (name, vals) => {
    const nutrients = {};
    NUTRIENT_KEYS.forEach(k => { nutrients[k] = (vals[k] === undefined ? null : vals[k]); });
    const newFood = { id: 'c' + Date.now(), name, source: 'custom', nutrients };
    setCustomFoods(prev => [...prev, newFood]);
  };

  const handleSaveRecipe = (recipe) => {
    setCustomFoods(prev => {
      const idx = prev.findIndex(f => f.id === recipe.id);
      const next = idx === -1 ? [...prev, recipe] : prev.map((f, i) => (i === idx ? recipe : f));
      // Editing a recipe's own ingredients can change its nutrients, which
      // needs to ripple to any OTHER recipe that nests this one.
      return recomputeDependents(next);
    });
  };

  const handleEditCustomFood = (id, name, vals) => {
    const nutrients = {};
    NUTRIENT_KEYS.forEach(k => { nutrients[k] = (vals[k] === undefined ? null : vals[k]); });
    setCustomFoods(prev => {
      const next = prev.map(f => (f.id === id ? { ...f, name, nutrients } : f));
      return recomputeDependents(next);
    });
  };

  const handleDeleteFood = (id) => {
    setCustomFoods(prev => {
      // Defense-in-depth: ManageFoodsPanel already blocks this in the UI,
      // but don't rely solely on that -- refuse here too if anything still
      // references this food.
      if (foodUsedInRecipes(id, prev).length > 0) return prev;
      return prev.filter(f => f.id !== id);
    });
  };

  const handleRequestEditRecipe = (recipeId) => {
    setTab('addfood');
    setEditRecipeRequest(recipeId);
  };

  if (loadError) {
    return (
      <div className="error-state">
        <strong>Couldn't load your data.</strong>
        <div style={{ marginTop: 6 }}>{loadError}</div>
        <div style={{ marginTop: 6 }}>
          Try reloading the page. If this keeps happening, the server may be down —
          check its status or try again shortly.
        </div>
      </div>
    );
  }
  if (!loaded) {
    return <div className="empty-state">Loading your data…</div>;
  }

  return (
    <div>
      <h1>NutriTool</h1>
      <div className="subtitle">
        Hosted nutrient intake tracker — the always-reachable companion to nutritool-local, so you can log
        food from your phone or any device. Requires internet and your shared password each session.
        {' '}<a href="/logout">Log out</a>
      </div>
      {saveError && (
        <div className="callout">
          Last save to the server failed: {saveError} — your latest change may not be persisted yet.
        </div>
      )}
      <div className="tabs">
        <button className={"tab" + (tab === 'dashboard' ? ' active' : '')} onClick={() => setTab('dashboard')}>Dashboard</button>
        <button className={"tab" + (tab === 'log' ? ' active' : '')} onClick={() => setTab('log')}>Log Food</button>
        <button className={"tab" + (tab === 'history' ? ' active' : '')} onClick={() => setTab('history')}>History</button>
        <button className={"tab" + (tab === 'addfood' ? ' active' : '')} onClick={() => setTab('addfood')}>Add Food</button>
        <button className={"tab" + (tab === 'managefoods' ? ' active' : '')} onClick={() => setTab('managefoods')}>My Foods</button>
        <button className={"tab" + (tab === 'settings' ? ' active' : '')} onClick={() => setTab('settings')}>Settings</button>
      </div>

      {tab === 'dashboard' && (
        <React.Fragment>
          <Dashboard levels={levels} targets={targets} />
          <details>
            <summary>About the decay / lookback model</summary>
            <div className="callout" style={{ marginTop: 6 }}>
              This tool is not clinically authoritative. Daily-reset nutrients (macros, sodium, potassium,
              vitamin C, B-vitamins) compare today's intake to today's target only. Lookback-window nutrients
              (other minerals, fat-soluble vitamins) compare a rolling, exponentially-decaying sum of recent
              intake to RDA x window-days — decay uses a half-life that defaults to window/2, except choline
              which uses an explicit 7-day half-life regardless of its 30-day window. The "sourced" vs
              "estimate" badges next to each lookback nutrient indicate whether its window/half-life comes
              from cited pharmacokinetic data or is an unsourced placeholder — see README for the full table
              and citations. Calcium is tracked against its daily RDA only, with no decay model, because
              short-term calcium status isn't a meaningful "depleting level" the way it is for iron or
              vitamin D (see the info icon on Calcium).
            </div>
          </details>
        </React.Fragment>
      )}
      {tab === 'log' && <LogEntryPanel foods={allFoods} onLog={handleLogFood} />}
      {tab === 'history' && <LogHistory entries={log} onDelete={handleDeleteEntry} onEditGrams={handleEditGrams} />}
      {tab === 'addfood' && (
        <AddFoodTabs
          allFoods={allFoods}
          recipes={customFoods.filter(f => f.source === 'recipe')}
          onAddSimple={handleAddFood}
          onSaveRecipe={handleSaveRecipe}
          editRecipeRequest={editRecipeRequest}
          onConsumeEditRecipeRequest={() => setEditRecipeRequest(null)}
        />
      )}
      {tab === 'managefoods' && (
        <ManageFoodsPanel
          customFoods={customFoods}
          onEditCustomFood={handleEditCustomFood}
          onDeleteFood={handleDeleteFood}
          onRequestEditRecipe={handleRequestEditRecipe}
        />
      )}
      {tab === 'settings' && <SettingsPanel config={config} onSave={setConfig} />}

      <div className="footer-note">
        Seed food data (~100 foods) is styled after USDA FoodData Central per-100g values, entered from
        general nutrition knowledge rather than fetched live. RDA/AI targets are sourced from NIH Office
        of Dietary Supplements fact sheets summarizing the National Academies' Dietary Reference Intakes.
        Treat all numbers here as personal-tracking estimates, not medical advice. This is the hosted
        companion to nutritool-local — see README.md for why it exists, the decay/lookback table, and the
        password-gate and deployment setup.
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
